<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#006241" />
      <stop offset="100%" stop-color="#00875a" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Base Seed Arc -->
  <path d="M 24 66 C 36 78, 64 78, 76 66" stroke="#00875a" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Central Seed Sprout Point -->
  <circle cx="50" cy="74" r="2.5" fill="#00875a" />

  <!-- Main Stem -->
  <path d="M 50 68 C 50 52, 49.5 35, 49.5 24" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Left Cotyledon (Microgreen leaf) -->
  <path d="M 49.5 45 C 36 43, 28 30, 32 18 C 44 18, 50 31, 49.5 45 Z" fill="url(#leafGrad)" />

  <!-- Right Emerging Leaf -->
  <path d="M 50 36 C 62 34, 70 23, 66 14 C 55 14, 49.5 25, 50 36 Z" fill="#00754A" />
</svg>
