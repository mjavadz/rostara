<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="primaryLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006241" />
      <stop offset="60%" stop-color="#00875a" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="secondaryLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004d33" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Left Main Leaf (Organic, sculptural curve tapering to base) -->
  <path d="M 50 86 C 49 68, 46 52, 34 38 C 22 24, 25 10, 36 12 C 50 14, 55 36, 52 58 C 50 70, 50 78, 50 86 Z" 
        fill="url(#primaryLeafGrad)" />

  <!-- Right Ascending Sprout Leaf (Harmonious balance) -->
  <path d="M 50 56 C 56 40, 68 24, 80 26 C 85 27, 84 38, 74 48 C 64 58, 54 58, 50 56 Z" 
        fill="url(#secondaryLeafGrad)" />

  <!-- Central Stem Vein Accent -->
  <path d="M 50 86 C 50 68, 49 46, 44 32" 
        stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" />
</svg>
